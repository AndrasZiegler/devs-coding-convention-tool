name: 02-Regression

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      trigger_consumer_workflows:
        description: "Also workflow_dispatch 00-Check-Code-Convention in each consumer repo"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      repo_count: ${{ steps.matrix.outputs.repo_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
